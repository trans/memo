name: memo
version: 0.8.2

description: |
  Memo - Semantic search and vector storage library for Crystal.
  Provides chunking, embedding storage, similarity search, and RRF fusion.

authors:
  - trans

repository: https://github.com/trans/memo

crystal: ">= 1.10.0"

dependencies:
  db:
    github: crystal-lang/crystal-db
  sqlite3:
    github: crystal-lang/crystal-sqlite3
  jargon:
    github: trans/jargon
    branch: main
  ignore:
    github: trans/ignore
    branch: main
  magic:
    github: naqvis/magic.cr
  usearch:
    github: trans/usearch.cr
    branch: main

targets:
  memo:
    main: src/cli/main.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba

license: MIT
